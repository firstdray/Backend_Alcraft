[build]
builder = "nixpacks"
buildCommand = "npm install && npm run build"

[deploy]
startCommand = "npm run start:prod"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

[variables]
NODE_ENV = "production"

[[services]]
name = "web"
$default = true

[[services]]
name = "migrations"
[startCommand]
migrations = "npm run migration:run"